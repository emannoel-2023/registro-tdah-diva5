# Nenhum segredo ou dado pessoal aqui. Os valores de configuração
# (ALLOWED_ORIGIN, TURNSTILE_SECRET, RESEND_API_KEY, MAIL_FROM) são
# enviados como *secrets* pelo GitHub Actions (veja o README).
name = "resultado-teste"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# Desliga os logs do Workers: nenhuma requisição fica registrada no painel.
[observability]
enabled = false

# Rate limit (contadores em memória da Cloudflare, nada é gravado).
# 5 requisições por minuto por IP.
[[ratelimits]]
name = "IP_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# No máximo 2 e-mails por minuto para o mesmo destinatário.
[[ratelimits]]
name = "EMAIL_LIMITER"
namespace_id = "1002"
simple = { limit = 2, period = 60 }
